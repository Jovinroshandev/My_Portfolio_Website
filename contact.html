<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class='section-one'>
            <h1 class='section-one__name'>Jovin Roshan</h1>
            <p class='section-one__role'>Python Fullstack Developer</p>
            <a href="index.html" class='section-one__contact'>Home</a>
        </div>
        <div class="contact-form">
            <form>
                <table>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" placeholder="Enter Your Name" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td><input type="email" placeholder="Enter Your Email" class="contact-form__input"></td>
                    </tr>
                    <tr>
                        <td>Message</td>
                        <td><textarea placeholder="Message" class="contact-form__textarea"></textarea></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type='submit' class="contact-form__submit"></td>
                    </tr>
                </table>
            </form>
        </div>
        <div class="section-six">
            <p class="section-six__title">Socil Media:
                <a id="section-six__one" href="https://www.linkedin.com/in/jovin-roshan-8091a0277/"target="_blank">Linkedin</a>
                <a id="section-six__two" href="https://www.instagram.com/cyb3r.jovin/" target="_blank">Instagram</a>
            </p>
            <p class='section-six__desc'>&copy; Jovin Roshan</p>
        </div>
    </div>
</body>

</html>
